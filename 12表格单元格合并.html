<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>合并单元格</title>
</head>
<body>
    <table border="1" width="600" height="400">
        <tr>
            <td colspan="3">单元格1</td>
            <td>单元格4</td>
            <td>单元格5</td>
        </tr>
        <tr>
            <td colspan="2">单元格6</td>
         
            <td>单元格8</td>
            <td>单元格9</td>
            <td>单元格10</td>
        </tr>
        <tr>
            <td>单元格11</td>
            <td>单元格12</td>
            <td>单元格13</td>
            <td>单元格14</td>
            <td rowspan="2">单元格15</td>
        </tr>
        <tr>
            <td>单元格16</td>
            <td colspan="2" rowspan="2">单元格17</td>
       
            <td>单元格19</td>
            
        </tr>
        <tr>
            <td>单元格21</td>
           
            <td>单元格24</td>
            <td>单元格25</td>
        </tr>
    </table>
</body>
</html>
